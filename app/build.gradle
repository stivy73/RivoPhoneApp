plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
    id 'com.google.devtools.ksp' version '2.1.0-1.0.29'
}

def baseVersionCode = 2026081400
def buildNumber = (System.getenv("BUILD_NUMBER") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int
def isPreviewBuild = System.getenv("PREVIEW_BUILD") == "true"
def baseVersionName = "2.1"

android {
    namespace = 'com.grinch.rivo4'
    compileSdk = 36

    defaultConfig {
        applicationId = "it.stivy.rivo.personal"
        minSdk = 31
        targetSdk = 36
        versionCode = baseVersionCode + buildNumber
        versionName = isPreviewBuild ? "${baseVersionName}.${buildNumber}-preview" : baseVersionName
        buildConfigField 'String', 'SCRCPY_VERSION', '"4.0"'
        buildConfigField 'String', 'SCRCPY_SERVER_SHA256', '"84924bd564a1eb6089c872c7521f968058977f91f5ff02514a8c74aff3210f3a"'
        buildConfigField 'String', 'SCRCPY_SERVER_ASSET_NAME', '"scrcpy-server"'
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) storeFile = file(System.getenv("KEYSTORE_PATH"))
            storePassword = System.getenv("KEYSTORE_PASSWORD")
            keyAlias = System.getenv("KEY_ALIAS")
            keyPassword = System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (System.getenv("KEYSTORE_PATH") && System.getenv("KEYSTORE_PASSWORD") && System.getenv("KEY_ALIAS") && System.getenv("KEY_PASSWORD")) {
                signingConfig = signingConfigs.release
            }
            debuggable = false
        }
        debug {
            applicationIdSuffix = ".debug"
            resValue "string", "app_name", "Rivo Personal"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)

            freeCompilerArgs.addAll(
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
            )
        }
    }

    buildFeatures {
        compose = true
        aidl = true
        buildConfig = true
    }

    androidResources {
        generateLocaleConfig = true
        // Personal edition ships the two fully maintained locales. Upstream translations stay in source.
        localeFilters += ["en", "it"]
    }

    splits {
        abi {
            enable = false
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
            isDefault = false
        }
        foss {
            dimension "distribution"
            isDefault = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "RivoPhone-${variant.versionName}-${variant.flavorName}.apk"
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("bundle") && it.name.endsWith("Release") }.configureEach { task ->
        task.doLast {
            def outDir = layout.buildDirectory.dir("outputs/bundle/${task.name.replace('bundle', '').uncapitalize()}").get().asFile
            if (outDir.exists()) {
                outDir.listFiles()?.each { file ->
                    if (file.name.endsWith(".aab") && !file.name.contains("RivoPhone")) {
                        file.renameTo(new File(outDir, "RivoPhone-${android.defaultConfig.versionName}-${task.name.replace('bundle', '').replace('Release', '').uncapitalize()}.aab"))
                    }
                }
            }
        }
    }

    // Prevent Windows java.nio.file.FileAlreadyExistsException during KSP compilation
    tasks.matching { it.name.startsWith("ksp") && it.name.endsWith("Kotlin") }.configureEach { task ->
        task.doFirst {
            def variantName = task.name.substring(3, task.name.length() - 6).uncapitalize()
            def kspGenDir = layout.buildDirectory.dir("generated/ksp/${variantName}").get().asFile
            if (kspGenDir.exists()) {
                project.delete(kspGenDir)
            }
        }
    }
}

dependencies {
    playImplementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha18'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'io.github.raamcosta.compose-destinations:core:2.1.0'
    ksp 'io.github.raamcosta.compose-destinations:ksp:2.1.0'

    implementation "com.google.accompanist:accompanist-permissions:0.37.3"

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation platform("io.insert-koin:koin-bom:4.1.1")
    implementation "io.insert-koin:koin-android"
    implementation "io.insert-koin:koin-androidx-compose"

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// Pinned ShizuCallRecorder 1.3.3 server. Verify on EVERY build, including cached assets.
def scrcpyAsset = layout.projectDirectory.file('src/main/assets/scrcpy-server')
tasks.register('verifyScrcpyServer') {
    inputs.file(scrcpyAsset)
    doLast {
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(scrcpyAsset.asFile.bytes).encodeHex().toString()
        if (actual != '84924bd564a1eb6089c872c7521f968058977f91f5ff02514a8c74aff3210f3a') {
            throw new GradleException('scrcpy-server 4.0 integrity check failed. Run scripts/fetch-scrcpy.sh.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyScrcpyServer' }
