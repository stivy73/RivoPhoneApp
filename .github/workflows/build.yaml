name: Validate Rivo Personal FOSS
on:
  push:
    branches: [main, codex/shizu-recorder-it, codex/caller-identification, codex/direct-provider-keys]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foss-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foss:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Italian translations
        run: python3 scripts/check-translations.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify direct provider credential plumbing
        run: python3 scripts/check-provider-security.py
      - name: Test historical caller proxy
        run: node --test backend/test/*.test.mjs
      - name: Clean, test, lint and build FOSS debug
        run: ./gradlew clean :app:testFossDebugUnitTest :app:lintFossDebug :app:assembleFossDebug
      - name: Scan generated APK for embedded provider keys
        run: python3 scripts/check-provider-security.py app/build/outputs/apk/foss/debug/*.apk
      - name: Compile Android device tests
        run: ./gradlew :app:assembleFossDebugAndroidTest
      - name: Package APK and checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/foss/debug/*.apk artifacts/
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-Personal-fossDebug
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-fossDebug.*
          if-no-files-found: warn
